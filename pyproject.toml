[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hot-omelet"
version = "1.0.0"
authors = [
    {name = "Hot Omelet Maintainers"}
]
description = "Offensive security toolkit with agent skills for authorized security testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "click",
    "rich",
    "requests",
    "dnspython",
    "beautifulsoup4",
    "redis",
    "packaging",
    "pymongo"
]

[project.optional-dependencies]
full = [
    "aiohttp",
    "minio",
    "mitmproxy",
    "netifaces",
    "openpyxl",
    "playwright",
    "playwright-stealth",
    "psycopg2-binary",
    "scapy",
    "websocket-client"
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff"
]

[project.scripts]
hot = "hot_omelet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hot_omelet*"]

[tool.ruff.lint]
# Classic default rule set, pinned explicitly so behavior is stable across ruff versions.
select = ["E4", "E7", "E9", "F"]
ignore = ["E722", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
