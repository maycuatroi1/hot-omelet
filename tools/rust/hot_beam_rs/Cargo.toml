[package]
name = "hot-beam"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
crossterm = "0.28"
colored = "2"
url = "2.5.8"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
