[package]
name = "ping-sweep"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ping-sweep"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"
clap = { version = "4", features = ["derive"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
